services:
  neo4j-compare:
    image: neo4j:5.26-community
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: neo4j/comparepass
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'

  gremlin-compare:
    image: tinkerpop/gremlin-server:3.7
    ports:
      - "8182:8182"
